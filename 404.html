<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080e17">
<title>页面不存在 · 内网激活</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background-color:#080e17;
    background-image:
      radial-gradient(58% 42% at 10% -8%, rgba(37,99,235,.22), transparent 70%),
      radial-gradient(52% 42% at 92% -4%, rgba(34,211,238,.13), transparent 72%),
      radial-gradient(70% 46% at 50% 106%, rgba(94,234,212,.07), transparent 74%);
    background-repeat:no-repeat; background-attachment:fixed;
    color:#e2edfa;
    font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; position:relative; overflow:hidden;
  }
  /* 星屑点缀：纯 CSS 光点 */
  .motes{position:fixed; inset:0; overflow:hidden; pointer-events:none}
  .motes i{
    position:absolute; top:-10vh; width:5px; height:5px; border-radius:50%;
    background:#7dd3fc; opacity:.5; box-shadow:0 0 9px 2px rgba(56,189,248,.55);
    animation:fall var(--d,18s) linear infinite, sway var(--s,3.6s) ease-in-out infinite alternate;
    animation-delay:var(--dl,0s),0s;
  }
  .motes i:nth-child(2){left:22%; --d:21s; --s:4.2s; --dl:-6s; background:#93b6f5; box-shadow:0 0 9px 2px rgba(99,140,240,.5)}
  .motes i:nth-child(3){left:44%; --d:17s; --s:3.4s; --dl:-12s}
  .motes i:nth-child(4){left:66%; --d:23s; --s:4.6s; --dl:-3s; background:#5eead4; box-shadow:0 0 10px 2px rgba(94,234,212,.45)}
  .motes i:nth-child(5){left:84%; --d:19s; --s:3.8s; --dl:-15s}
  .motes i:nth-child(6){left:8%;  --d:24s; --s:4.8s; --dl:-9s; width:3px; height:3px}
  @keyframes fall{0%{transform:translate3d(0,-10vh,0)}100%{transform:translate3d(0,110vh,0)}}
  @keyframes sway{0%{margin-left:-18px}100%{margin-left:18px}}

  /* 一台找不到频道的小电视 */
  .box{
    position:relative; z-index:1;
    width:520px; max-width:100%; padding:13px; border-radius:26px;
    background:linear-gradient(160deg,#1c2a3d 0%,#16222f 52%,#101a26 100%);
    border:1px solid rgba(120,160,210,.22);
    box-shadow:0 30px 60px -34px #000, inset 0 1px 0 rgba(255,255,255,.09),
               inset 0 -2px 4px rgba(0,0,0,.5);
  }
  /* 底座 */
  .box::after{
    content:''; position:absolute; left:13%; right:13%; bottom:-17px; height:17px; z-index:0;
    background:linear-gradient(180deg,#16222f 0%,#0c1520 100%);
    border-radius:0 0 10px 10px;
    clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
    box-shadow:0 18px 26px -18px #000;
    pointer-events:none;
  }
  .bar{
    display:flex; align-items:center; gap:7px; padding:0 5px 11px;
  }
  .bar i{width:9px; height:9px; border-radius:50%; box-shadow:inset 0 -1px 1px rgba(0,0,0,.45)}
  .bar i:nth-child(1){background:#3b82f6}
  .bar i:nth-child(2){background:#22d3ee}
  .bar i:nth-child(3){background:#34d399}
  .bar span{margin-left:4px; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#7b91ac}
  .led{margin-left:auto; width:7px; height:7px; border-radius:50%;
       background:#34d399; box-shadow:0 0 8px 1px rgba(52,211,153,.9);
       animation:blink 3.6s ease-in-out infinite}
  @keyframes blink{0%,93%,100%{opacity:1}96%{opacity:.3}}

  /* 屏幕 */
  .screen{
    position:relative; overflow:hidden; padding:44px 26px 34px; border-radius:18px; text-align:center;
    background:radial-gradient(125% 95% at 50% 0%, #0f1e2e 0%, #08121c 44%, #040a11 100%);
    border:1px solid rgba(120,180,230,.14);
    box-shadow:inset 0 0 70px rgba(0,0,0,.85), inset 0 0 30px rgba(0,20,40,.55);
  }
  .screen::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.032) 0 1px, transparent 1px 3px);
  }
  .screen::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(114deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 34%,
               rgba(255,255,255,0) 66%, rgba(255,255,255,.04) 100%);
  }
  .screen > *{position:relative; z-index:1}
  .code{
    font-size:54px; font-weight:800; letter-spacing:.08em; line-height:1.1;
    background:linear-gradient(115deg,#38bdf8 0%,#22d3ee 55%,#5eead4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(56,189,248,.45));
  }
  .nosig{
    display:block; margin-top:6px;
    font:10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
    letter-spacing:.34em; text-transform:uppercase; color:#5eead4;
    animation:nosig 2.8s steps(1) infinite;
  }
  @keyframes nosig{0%,72%{opacity:.9}76%,100%{opacity:.16}}
  h1{margin:14px 0 8px; font-size:17px; font-weight:800; color:#eaf5ff; letter-spacing:.03em}
  p{margin:0 0 24px; color:#7b91ac; font-size:12.5px}
  a{
    display:inline-block; padding:11px 26px; border-radius:999px; text-decoration:none;
    font-size:13px; font-weight:800; color:#04121c;
    background:linear-gradient(115deg,#38bdf8 0%,#22d3ee 55%,#5eead4 100%);
    box-shadow:0 12px 26px -14px rgba(56,189,248,.85);
    transition:transform .18s, box-shadow .18s;
  }
  a:hover{transform:translateY(-1px); box-shadow:0 16px 30px -14px rgba(56,189,248,.95)}

  /* 机身底部：旋钮 + 喇叭网 */
  .foot{display:flex; align-items:center; gap:10px; padding:12px 6px 3px}
  .knob{
    width:16px; height:16px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 34% 30%, #3c4d61 0%, #26343f 55%, #16212b 100%);
    border:1px solid rgba(120,160,210,.28);
    box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 -1px 2px rgba(0,0,0,.5);
  }
  .grill{
    flex:1; height:10px; border-radius:6px;
    background-image:radial-gradient(circle, rgba(120,160,210,.35) 1px, transparent 1.2px);
    background-size:7px 7px; background-position:0 50%; opacity:.75;
  }
  .brand{font-size:9px; letter-spacing:.24em; color:#5d7290; flex:none}
  @media (max-width:520px){
    .box{padding:10px; border-radius:22px}
    .screen{padding:38px 18px 28px; border-radius:15px}
    .code{font-size:44px}
    .box::after{left:10%; right:10%; bottom:-14px; height:14px}
  }
  @media (prefers-reduced-motion: reduce){.motes{display:none} *{transition-duration:.01ms !important; animation:none !important}}
</style>
</head>
<body>
  <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="box">
    <div class="bar"><i></i><i></i><i></i><span>404 — not found</span><span class="led" aria-hidden="true"></span></div>
    <div class="screen">
      <div class="code">404</div>
      <span class="nosig">no signal</span>
      <h1>这个页面不存在</h1>
      <p>地址可能输错了，或者文件没有被一起部署。</p>
      <a href="./index.html">回到激活指引首页</a>
    </div>
    <div class="foot" aria-hidden="true">
      <span class="knob"></span><span class="knob"></span>
      <span class="grill"></span>
      <span class="brand">KMS</span>
    </div>
  </div>
</body>
</html>
